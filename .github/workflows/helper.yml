name: Helper

on:
  workflow_call:
    inputs:
      ref:
        description: Source commit to check and build
        required: true
        type: string

permissions:
  contents: read

jobs:
  helper:
    name: Check helper linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Vet helper
        working-directory: helper
        run: go vet ./...
      - name: Install Bubblewrap for isolation tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Test helper locally (no SSH)
        working-directory: helper
        env:
          DELION_REQUIRE_LINUX_SANDBOX_TEST: '1'
        run: go test -count=1 -timeout=2m ./...
      - name: Build helper
        run: node scripts/build-helper.ts --all
      - name: Smoke test helper executable
        env:
          HELPER_ARCH: ${{ matrix.arch }}
        run: |
          "./vendor/delion-helper/delion-helper-linux-${HELPER_ARCH}" --version
      - uses: actions/upload-artifact@v6
        with:
          name: helper-linux-${{ matrix.arch }}
          path: vendor/delion-helper/delion-helper-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
