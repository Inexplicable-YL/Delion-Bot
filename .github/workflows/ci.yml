name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: v8.30.1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.common == 'true' || steps.filter.outputs.windows == 'true' || steps.filter.outputs.helper == 'true' }}
      helper: ${{ steps.filter.outputs.helper == 'true' || steps.filter.outputs.common == 'true' }}
      windows: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.runtime == 'true' || steps.filter.outputs.helper == 'true' || steps.filter.outputs.windows == 'true' }}
      macos: ${{ steps.filter.outputs.archives == 'true' || steps.filter.outputs.common == 'true' || steps.filter.outputs.runtime == 'true' || steps.filter.outputs.helper == 'true' || steps.filter.outputs.macos == 'true' }}
      archives: ${{ steps.filter.outputs.common == 'true' || steps.filter.outputs.archives == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            app:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'docs/terms.md'
              - 'docs/privacy.md'
              - 'vendor/bin/**'
              - '.github/workflows/quality.yml'
              - '.github/workflows/test.yml'
              - '.editorconfig'
              - '.oxlintrc*'
              - 'oxlint.config.*'
              - '.prettierignore'
              - '.prettierrc*'
              - 'vitest*.config.*'
              - 'tsconfig*.json'
            common:
              - '.github/workflows/ci.yml'
              - '.github/workflows/desktop-windows.yml'
              - '.github/workflows/desktop-macos.yml'
              - '.github/workflows/release.yml'
              - 'package.json'
              - '.node-version'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'electron-builder.*'
              - 'vite.*.config.*'
              - 'build/**'
              - 'assets/**'
            helper:
              - '.github/workflows/helper.yml'
              - 'helper/**'
              - 'scripts/build-helper.ts'
              - 'vendor/delion-helper/**'
            runtime:
              - 'helper/**'
              - 'vendor/delion-helper/**'
              - 'scripts/**'
              - 'src/app/main/**'
              - 'src/core/remote/**'
              - 'src/modules/terminal/**'
              - 'src/modules/remotes/**'
              - 'src/modules/preview/**'
              - 'src/modules/update/**'
              - 'src/app/preload/**'
              - 'vendor/bin/*'
            windows:
              - 'vendor/openssh/**'
            macos:
              - 'vendor/bin/darwin-*/**'
            archives:
              - 'scripts/verify-macos-package.ts'

  quality:
    needs: changes
    uses: ./.github/workflows/quality.yml

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/test.yml

  helper:
    needs: changes
    if: needs.changes.outputs.helper == 'true'
    uses: ./.github/workflows/helper.yml
    with:
      ref: ${{ github.sha }}

  windows:
    needs: [changes, test, helper]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && needs.test.result == 'success' &&
          needs.changes.outputs.windows == 'true' &&
          (needs.helper.result == 'success' ||
           (needs.changes.outputs.helper == 'false' && needs.helper.result == 'skipped')) }}
    uses: ./.github/workflows/desktop-windows.yml
    with:
      helper: ${{ needs.changes.outputs.helper == 'true' }}
      archives: ${{ needs.changes.outputs.archives == 'true' }}

  macos:
    needs: [changes, helper]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.macos == 'true' &&
          (needs.helper.result == 'success' ||
           (needs.changes.outputs.helper == 'false' && needs.helper.result == 'skipped')) }}
    uses: ./.github/workflows/desktop-macos.yml
    with:
      helper: ${{ needs.changes.outputs.helper == 'true' }}
      archives: ${{ needs.changes.outputs.archives == 'true' }}

  secrets:
    name: Secret scan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..HEAD"

  dependencies:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  required:
    name: CI required
    if: always()
    needs: [changes, quality, test, helper, windows, macos, secrets, dependencies, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required results
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          for (const name of ['changes', 'quality', 'codeql']) {
            if (needs[name].result !== 'success') {
              throw new Error(name + ': ' + needs[name].result);
            }
          }
          const pullRequest = process.env.EVENT_NAME === 'pull_request';
          for (const name of ['secrets', 'dependencies']) {
            const expected = pullRequest ? 'success' : 'skipped';
            if (needs[name].result !== expected) {
              throw new Error(name + ': expected ' + expected + ', got ' + needs[name].result);
            }
          }
          for (const name of ['test', 'helper', 'windows', 'macos']) {
            const selected = needs.changes.outputs[name === 'test' ? 'app' : name];
            if (!['true', 'false'].includes(selected)) throw new Error('Missing selection: ' + name);
            const expected = selected === 'true' ? 'success' : 'skipped';
            if (needs[name].result !== expected) {
              throw new Error(name + ': expected ' + expected + ', got ' + needs[name].result);
            }
          }
          NODE
