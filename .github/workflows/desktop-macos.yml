name: Desktop macos validation

on:
  workflow_call:
    inputs:
      helper:
        description: Download helper binaries built in this run
        required: true
        type: boolean
      archives:
        description: Build installers instead of directory packages
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  macos:
    name: Check mac-arm64
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DELION_REMOTE_HOST: ''
      PACKAGED_APP: 'dist/mac-arm64/Delion Bot.app'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        if: inputs.helper
        with:
          name: helper-linux-amd64
          path: vendor/delion-helper
      - uses: actions/download-artifact@v7
        if: inputs.helper
        with:
          name: helper-linux-arm64
          path: vendor/delion-helper
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: arm64
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: |
          (cd helper && go test -count=1 ./scope)
          pnpm build:scopedfs
          pnpm build:bundle
          pnpm test
      - name: Report sandbox launch failures
        if: failure()
        run: |
          /usr/bin/log show --last 6m --style compact --predicate 'eventMessage CONTAINS "delion-command"' 2>/dev/null | tail -n 30 || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = Path.home() / "Library" / "Logs" / "DiagnosticReports"
          for path in sorted(reports.glob("bash-*.ips"), key=lambda p: p.stat().st_mtime)[-2:]:
              try:
                  report = json.loads(path.read_text().split("\n", 1)[1])
              except (OSError, ValueError, IndexError):
                  continue
              print({key: report[key] for key in ("exception", "termination") if key in report})
          PY
      - name: Smoke test Electron and runtime
        run: |
          node scripts/ci-smoke.ts "Electron and native dependencies" pnpm smoke
          node scripts/ci-smoke.ts "Agent runtime" pnpm smoke:runtime
          node scripts/ci-smoke.ts "Desktop behavior" pnpm smoke:desktop
          node scripts/ci-smoke.ts "Workspace behavior" pnpm smoke:workspace
          node scripts/ci-smoke.ts "Terminal behavior" pnpm exec electron scripts/terminal-smoke.cjs
      - name: Fetch remote rg
        run: pnpm fetch:remote-rg
      - name: Package application directory
        if: ${{ !inputs.archives }}
        run: pnpm exec electron-builder --dir --mac --arm64 --publish never -c.electronDist=node_modules/electron/dist
      - name: Build development DMG and ZIP
        if: inputs.archives
        run: pnpm exec electron-builder --mac --arm64 --publish never -c.electronDist=node_modules/electron/dist
      - name: Verify package resources
        if: ${{ !inputs.archives }}
        run: node scripts/verify-macos-package.ts "$PACKAGED_APP" --dir
      - name: Verify package resources and archives
        if: inputs.archives
        run: node scripts/verify-macos-package.ts "$PACKAGED_APP"
      - name: Smoke test packaged app and native dependencies
        run: |
          node scripts/ci-smoke.ts "Packaged Electron and native dependencies" "$PACKAGED_APP/Contents/MacOS/Delion Bot" --smoke-test
          node scripts/ci-smoke.ts "Packaged desktop behavior" pnpm smoke:desktop "$PACKAGED_APP/Contents/Resources/app.asar"
          node scripts/ci-smoke.ts "Packaged terminal behavior" pnpm exec electron scripts/terminal-smoke.cjs "$PACKAGED_APP/Contents/Resources/app.asar"
      - uses: actions/upload-artifact@v6
        if: inputs.archives
        with:
          name: development-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
